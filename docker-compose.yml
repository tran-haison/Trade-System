version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/barter-trading
      - SESSION_SECRET=barter-trading-secret-key-2025
      - PORT=3000
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_started
    volumes:
      - ./public/uploads:/usr/src/app/public/uploads
    networks:
      - app-network
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=barter-trading
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
    name: barter-trading-mongodb-data

networks:
  app-network:
    name: barter-trading-network
    driver: bridge
