# Project identification
sonar.projectKey=tran-haison_Trade-System
sonar.projectName=Barter Trading System
sonar.organization=tran-haison

# Source code location
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/tests/**,**/*.test.js,**/*.spec.js,**/Dockerfile*

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.file.suffixes=js,jsx,ts,tsx

# Test coverage settings
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/tests/**

# Quality Gate
sonar.qualitygate.wait=true

# Server configuration
sonar.host.url=https://sonarcloud.io
