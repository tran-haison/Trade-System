services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:/var/jenkins_home/workspace
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/barter-trading
    networks:
      - jenkins-network
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=barter-trading
    networks:
      - jenkins-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  jenkins_home:
    name: jenkins_home
  mongodb_data:
    name: mongodb_data

networks:
  jenkins-network:
    name: jenkins-network
    driver: bridge
