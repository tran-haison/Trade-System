# Project identification
sonar.projectKey=barter-trading
sonar.projectName=Barter Trading System
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/tests/**,**/*.test.js,**/*.spec.js

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.file.suffixes=js,jsx,ts,tsx

# Test coverage settings
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/tests/**

# Quality Gate
sonar.qualitygate.wait=true

# Server configuration
sonar.host.url=http://localhost:9000
