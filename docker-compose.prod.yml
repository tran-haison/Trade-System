version: "3.8"

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: barter-trading-prod
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/usr/src/app/public/uploads
    environment:
      - MONGODB_URI=mongodb://localhost:27017/barter-trading
      - SESSION_SECRET=barter-trading-secret-key-2025
      - NODE_ENV=production
      - PORT=3000
    networks:
      - barter-network
    restart: unless-stopped

networks:
  barter-network:
    driver: bridge
